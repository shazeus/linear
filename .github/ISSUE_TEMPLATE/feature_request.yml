name: Feature request
description: Propose a focused improvement to Linear
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What editing or graphics task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe controls, output, and expected defaults.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Host and compatibility considerations
      description: Mention After Effects, Premiere Pro, performance, or saved-project impact.
