name: Bug report
description: Report reproducible incorrect behavior in Linear
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private footage, project data, and Adobe SDK files.
  - type: input
    id: version
    attributes:
      label: Linear version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - After Effects
        - Premiere Pro
        - Core library/test executable
        - Other
    validations:
      required: true
  - type: input
    id: host_version
    attributes:
      label: Host and Windows version
      placeholder: Premiere Pro 26.x on Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence of actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: text
